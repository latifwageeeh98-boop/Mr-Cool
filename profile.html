<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات العميل | Mr Cool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #0056b3; --accent: #25d366; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .profile-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .profile-container i { color: var(--primary); margin-bottom: 15px; }
        .profile-container h2 { margin-bottom: 25px; color: #333; }
        
        .form-group { text-align: right; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 5px rgba(0,86,179,0.2); }
        
        .save-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .save-btn:hover { background: #004494; }
        
        .back-link { display: block; margin-top: 20px; color: #777; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="profile-container">
        <i class="fas fa-user-circle fa-4x"></i>
        <h2>تسجيل بيانات العميل</h2>
        
        <form id="profileForm">
            <div class="form-group">
                <label>الاسم بالكامل</label>
                <input type="text" id="userName" placeholder="أدخل اسمك" required>
            </div>
            
            <div class="form-group">
                <label>رقم الموبايل</label>
                <input type="tel" id="userPhone" placeholder="01xxxxxxxxx" required>
            </div>
            
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="userEmail" placeholder="example@mail.com" required>
            </div>
            
            <button type="submit" class="save-btn">حفظ البيانات</button>
        </form>
        
        <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة للمتجر</a>
    </div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('userName').value,
                phone: document.getElementById('userPhone').value,
                email: document.getElementById('userEmail').value
            };
            
            // حفظ البيانات في ذاكرة المتصفح
            localStorage.setItem('mrCoolCustomer', JSON.stringify(userData));
            
            alert('تم حفظ بياناتك بنجاح يا ' + userData.name);
            window.location.href = 'index.html'; // يرجعه للرئيسية بعد الحفظ
        });

        // لو العميل مسجل قبل كدة، البيانات تظهر تلقائياً
        window.onload = function() {
            const savedData = localStorage.getItem('mrCoolCustomer');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('userName').value = data.name;
                document.getElementById('userPhone').value = data.phone;
                document.getElementById('userEmail').value = data.email;
            }
        };
    </script>
</body>
</html>
