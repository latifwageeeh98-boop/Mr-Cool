<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات العميل | Mr Cool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #0056b3; --accent: #25d366; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .profile-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .profile-container i { color: var(--primary); margin-bottom: 15px; }
        .profile-container h2 { margin-bottom: 10px; color: #333; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { text-align: right; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 5px rgba(0,86,179,0.2); }
        
        .save-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .save-btn:hover { background: #004494; }
        .save-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .back-link { display: block; margin-top: 20px; color: #777; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="profile-container">
        <i class="fas fa-user-circle fa-4x"></i>
        <h2>تسجيل بيانات العميل</h2>
        <div class="subtitle">(يرجى ملء خانتين على الأقل لحفظ البيانات)</div>
        
        <form id="profileForm">
            <div class="form-group">
                <label>الاسم بالكامل</label>
                <input type="text" id="userName" placeholder="أدخل اسمك (اختياري)">
            </div>
            
            <div class="form-group">
                <label>رقم الموبايل</label>
                <input type="tel" id="userPhone" placeholder="01xxxxxxxxx (اختياري)">
            </div>
            
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="userEmail" placeholder="example@mail.com (اختياري)">
            </div>
            
            <button type="submit" class="save-btn" id="saveBtn">حفظ البيانات</button>
        </form>
        
        <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة للمتجر</a>
    </div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const email = document.getElementById('userEmail').value.trim();

            let filledCount = 0;
            if (name !== "") filledCount++;
            if (phone !== "") filledCount++;
            if (email !== "") filledCount++;

            if (filledCount < 2) {
                alert('من فضلك املأ خانتين على الأقل للتسجيل.');
                return;
            }

            const userData = { name: name, phone: phone, email: email };
            
            saveBtn.disabled = true;
            saveBtn.innerText = "جاري الحفظ والربط...";

            // الرابط الجديد بتاعك مدمج هنا وجاهز للاستخدام فوراً
            const googleAppUrl = "https://script.google.com/macros/s/AKfycbxyTjGMlEFIr2B6VtwbPhfd94kuU6TGoHFeKq6drPgALMshx5JDDrbGnxA_3uYOqn5q/exec";
            
            const finalUrl = `${googleAppUrl}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&email=${encodeURIComponent(email)}`;
            
            // إرسال سريع ومباشر لجوجل شيت بدون قيود المتصفح
            const img = new Image();
            img.src = finalUrl;
            
            // بمجرد اللمس، يتم الحفظ والتحويل للرئيسية
            img.onload = img.onerror = function() {
                localStorage.setItem('mrCoolCustomer', JSON.stringify(userData));
                alert('تم حفظ بياناتك بنجاح في نظام Mr Cool يا هندسة!');
                window.location.href = 'index.html';
            };
        });

        window.onload = function() {
            const savedData = localStorage.getItem('mrCoolCustomer');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('userName').value = data.name || '';
                document.getElementById('userPhone').value = data.phone || '';
                document.getElementById('userEmail').value = data.email || '';
            }
        };
    </script>
</body>
</html>
